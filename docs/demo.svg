<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="'Cascadia Code', Consolas, 'Courier New', monospace">
  <rect x="0" y="0" width="860" height="540" rx="12" fill="#161b22"/>
  <rect x="0" y="0" width="860" height="38" rx="12" fill="#21262d"/>
  <circle cx="26" cy="19" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="19" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="19" r="6.5" fill="#28c840"/>
  <text x="430" y="24" text-anchor="middle" fill="#8b949e" font-size="13">loglens — bash</text>

  <text x="24" y="66" fill="#c9d1d9" font-size="14"><tspan fill="#3fb950" font-weight="bold">$</tspan> loglens analyze app.log</text>
  <text x="24" y="88" fill="#6e7681" font-size="13">  Analyzing log file: app.log</text>
  <text x="24" y="106" fill="#6e7681" font-size="13">  Detected 12 errors, 3 warnings (scanned 2,481 lines)</text>

  <rect x="24" y="124" width="812" height="86" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="150" fill="#f0883e" font-size="14" font-weight="bold">&#9487; &#128202; Analysis Summary &#12531;&#9489;</text>
  <text x="40" y="174" fill="#c9d1d9" font-size="13">  <tspan fill="#f85149">[ERROR]</tspan> ConnectionError: db pool exhausted  <tspan fill="#8b949e">x 11</tspan></text>
  <text x="40" y="196" fill="#c9d1d9" font-size="13">  <tspan fill="#d29922">[WARN]</tspan> Retry attempt exceeded threshold      <tspan fill="#8b949e">x 3</tspan></text>

  <rect x="24" y="222" width="812" height="92" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="248" fill="#58a6ff" font-size="14" font-weight="bold">&#9487; &#127919; Root Cause &#12531;&#9489;</text>
  <text x="40" y="272" fill="#c9d1d9" font-size="13">  UserService.getUser fails because the DB connection pool</text>
  <text x="40" y="294" fill="#c9d1d9" font-size="13">  (max 20) is exhausted by unclosed sessions in checkout flow</text>

  <rect x="24" y="326" width="812" height="106" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="352" fill="#3fb950" font-size="14" font-weight="bold">&#9487; &#128161; Suggested Fix &#12531;&#9489;</text>
  <text x="40" y="376" fill="#c9d1d9" font-size="13">  1. Wrap sessions in context manager to guarantee release</text>
  <text x="40" y="398" fill="#c9d1d9" font-size="13">  2. Raise pool size to 50 or enable pool_recycle=3600</text>
  <text x="40" y="420" fill="#c9d1d9" font-size="13">  3. Add retry with exponential backoff on ConnectionError</text>

  <text x="24" y="462" fill="#6e7681" font-size="13">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text>
  <text x="24" y="486" fill="#8b949e" font-size="13">Lines analyzed <tspan fill="#c9d1d9">2,481</tspan>   Errors <tspan fill="#f85149">12</tspan>   Warnings <tspan fill="#d29922">3</tspan>   Time <tspan fill="#3fb950">3.8s</tspan></text>
  <text x="24" y="510" fill="#c9d1d9" font-size="14"><tspan fill="#3fb950" font-weight="bold">$</tspan> <tspan fill="#3fb950">&#9611;</tspan></text>
